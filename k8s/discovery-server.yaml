apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels: {app: discovery-server}
  template:
    metadata:
      labels: {app: discovery-server}
    spec:
      containers:
        - name: discovery-server
          image: portal/discovery-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: portal-config}
            - secretRef: {name: portal-secrets}
          ports:
            - containerPort: 8761
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8761}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8761}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8761}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: portal
spec:
  selector: {app: discovery-server}
  ports:
    - port: 8761
      targetPort: 8761
