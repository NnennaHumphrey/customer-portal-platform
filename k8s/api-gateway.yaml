apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: portal
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: portal/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: portal-config}
            - secretRef: {name: portal-secrets}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: portal
spec:
  selector: {app: api-gateway}
  ports:
    - port: 8080
      targetPort: 8080
