apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
    spec:
      containers:
        - name: notification-service
          image: portal/notification-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: portal-config}
            - secretRef: {name: portal-secrets}
          ports:
            - containerPort: 8084
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8084}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8084}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8084}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: portal
spec:
  selector: {app: notification-service}
  ports:
    - port: 8084
      targetPort: 8084
